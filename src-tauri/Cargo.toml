[package]
name = "qwenpaw-lite"
version = "0.1.0"
description = "QwenPaw 轻量桌面助手"
authors = ["duzuzeng"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to only be an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qwenpaw_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
window-vibrancy = "0.8.1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-http = "2.8.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(debug_assertions)".dependencies]
tauri-plugin-wdio = "1.5.0"
tauri-plugin-wdio-webdriver = "1.5.0"
