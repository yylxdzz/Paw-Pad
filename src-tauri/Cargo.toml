[package]
name = "qwenpaw-lite"
version = "1.0.0"
description = "QwenPaw 轻量桌面助手"
authors = ["duzuzeng"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to only be an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qwenpaw_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "custom-protocol"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
# 方案 A（2026-10-24）：window-vibrancy（apply_vibrancy / apply_liquid_glass）已弃用
# ——原生材质的 backdrop 是窗口服务器侧表面，hide 后不回收 = 桌面浅灰残留，且做不了
# 浅色模式。主窗口毛玻璃改由 CSS backdrop-filter 提供（src/styles/app.css .app-shell）。
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-http = "2.8.3"
# 模块 2（2.1）：file_search.rs 的 FileEntry derive Serialize 需要 serde 直接依赖
# （tauri 只传递依赖 serde，本 crate 无法直接 `use serde::`——floating_orb.rs 的
# serde import 同样依赖本条）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 模块 6（6.3）：logger.rs 的本地时间 / 按日轮转 / 7 天清理
chrono = "0.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(debug_assertions)".dependencies]
tauri-plugin-wdio = "1.5.0"
tauri-plugin-wdio-webdriver = "1.5.0"
