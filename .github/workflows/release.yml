name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: pnpm install --no-frozen-lockfile --config.strictDepBuilds=false

      - name: Build and publish draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Paw Pad ${{ github.ref_name }}"
          releaseBody: |
            未签名构建：首次打开如被 macOS 拦截，请在访达中右键 Paw Pad →「打开」，或到「系统设置 → 隐私与安全性」点「仍要打开」。
            系统要求：macOS 15+（Apple Silicon）。
          releaseDraft: true
          prerelease: false
